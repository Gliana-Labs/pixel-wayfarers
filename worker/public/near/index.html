<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel Wayfarers on NEAR: NFTs that earn</title>
<meta name="description" content="Each Pixel Wayfarer is a NEAR account of its own: it earns from every scene commissioned with it, holds its gallery, opens the holders' Tavern, and pays whoever holds it.">
<link rel="icon" href="/favicon.png">
<link rel="preload" href="/fonts/pixelify-sans-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/icons/phosphor-bold.css">
<link rel="stylesheet" href="/styles.css">
<style>
  body.near { background: var(--night); color: var(--cream); font-family: var(--body); margin: 0; }
  .near .top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 14px 24px; background: var(--wood-dark); border-bottom: 4px solid var(--ink); position: sticky; top: 0; z-index: 5; }
  .near .brand { font: 700 22px var(--display); color: var(--gold); text-decoration: none; }
  .near .net { font: 600 12px var(--mono); color: var(--uncommon); border: 2px solid var(--uncommon); border-radius: 4px; padding: 2px 6px; }
  .near #who { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .near .acct { font: 500 13px var(--mono); color: var(--muted); }
  .near main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 60px; display: grid; gap: 20px; }
  .near .panel { background: var(--wood); border: var(--frame); box-shadow: inset 0 0 0 4px var(--wood-mid); padding: 22px; border-radius: 6px; }
  .near h1, .near h2 { font-family: var(--display); color: var(--gold); margin: 0 0 12px; }
  .near h1 { font-size: clamp(30px, 5vw, 48px); }
  .near h2 { font-size: 22px; }
  .near .lead { font-size: 17px; line-height: 1.5; color: var(--cream); max-width: 760px; }
  .near .facts { list-style: none; padding: 0; margin: 16px 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 8px; }
  .near .facts li { background: var(--wood-dark); padding: 10px 12px; border-radius: 4px; }
  .near .facts code { font: 12px var(--mono); color: var(--gold); }
  .near .btn { font: 700 15px var(--display); background: var(--gold); color: var(--ink); border: 3px solid var(--ink); border-radius: 4px; padding: 8px 14px; cursor: pointer; }
  .near .btn.ghost { background: transparent; color: var(--cream); border-color: var(--muted); }
  .near .btn.big { font-size: 19px; padding: 12px 20px; }
  .near .btn:disabled { opacity: .5; cursor: not-allowed; }
  .near .mint { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 8px; }
  .near .muted { color: var(--muted); }
  .near .small { font-size: 13px; }
  .near .warn { color: #ff9b85; }
  .near a { color: var(--gold); }
  .near .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
  .near .wf { display: grid; gap: 4px; background: var(--wood-dark); padding: 8px; border-radius: 4px; text-decoration: none; color: var(--cream); }
  .near .wf img { width: 100%; height: auto; image-rendering: pixelated; border-radius: 2px; }
  .near .bal { font: 12px var(--mono); color: var(--uncommon); }
  .near .token { display: grid; grid-template-columns: minmax(0, 420px) minmax(0, 1fr); gap: 24px; }
  .near .art { width: 100%; height: auto; image-rendering: pixelated; border: var(--frame); border-radius: 4px; }
  .near dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0 0 14px; }
  .near dt { color: var(--muted); }
  .near dd { margin: 0; overflow-wrap: anywhere; }
  .near .money { font-family: var(--mono); color: var(--uncommon); }
  .near .row { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0; }
  .near input, .near select { font: 15px var(--body); padding: 8px 10px; border: 3px solid var(--ink); border-radius: 4px; background: var(--parchment); color: var(--ink); min-width: 0; }
  .near .commission { display: grid; gap: 8px; background: var(--wood-dark); padding: 14px; border-radius: 4px; margin-top: 12px; }
  .near .commission h2 { font-size: 18px; margin: 0; }
  .near .hist { width: 100%; border-collapse: collapse; }
  .near .hist td { padding: 8px 6px; border-top: 2px solid var(--wood-mid); }
  .near .board { list-style: none; padding: 0; display: grid; gap: 8px; }
  .near .board li { background: var(--wood-dark); padding: 10px 12px; border-radius: 4px; }
  .near .hero { position: relative; overflow: hidden; }
  .near .hero-art { display: block; max-width: none; width: calc(100% + 44px); height: 180px; object-fit: cover; image-rendering: pixelated; margin: -22px -22px 18px; border-bottom: 4px solid var(--ink); }
  .near .how { list-style: none; counter-reset: how; padding: 0; margin: 18px 0 6px; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
  .near .how li { counter-increment: how; background: var(--parchment); color: var(--ink); padding: 12px 14px 12px 46px; border: 3px solid var(--ink); border-radius: 4px; position: relative; line-height: 1.35; }
  .near .how li::before { content: counter(how); position: absolute; left: 12px; top: 10px; width: 24px; height: 24px; display: grid; place-items: center; background: var(--gold); border: 2px solid var(--ink); border-radius: 50%; font: 700 14px var(--display); }
  .near .wf { transition: transform .12s ease; }
  .near .sale { font: 700 12px var(--mono); color: var(--ink); background: var(--gold); border-radius: 3px; padding: 2px 6px; justify-self: start; }
  .near .market { background: var(--wood-dark); padding: 14px; border-radius: 4px; margin-top: 12px; display: grid; gap: 8px; }
  .near .market h2 { font-size: 18px; margin: 0; }
  .near .wf:hover { transform: translateY(-3px); }
  @media (max-width: 760px) { .near .token { grid-template-columns: 1fr; } .near #who { margin-left: 0; width: 100%; } }
</style>
</head>
<body class="near">
<header class="top"><a class="brand" href="/near/">Pixel Wayfarers</a><span class="net">NEAR testnet</span><a class="small" href="/near/?tavern">Tavern</a><a class="small" href="https://github.com/Gliana-Labs/pixel-wayfarers/tree/main/near">Code</a><div id="who"></div></header>
<main id="main"><section class="panel"><p class="muted">Reading the collection from NEAR…</p></section></main>
<script type="module" src="/near/app.js"></script>
</body>
</html>
