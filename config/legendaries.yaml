# Hand-authored 1/1s. Each gets its own name, bespoke prompt and trait values
# that exist nowhere else in the collection. Count must match tiers.legendary.count.
- name: The Harvest King
  prompt: >-
    regal old farmer king on a throne of hay bales and giant pumpkins, golden
    wheat crown, cape of autumn leaves, rays of divine sunlight, crows bowing
  traits: {Role: Harvest King, Background: Throne of Harvest, Headwear: Wheat Crown}

- name: Queen of the Deep
  prompt: >-
    mermaid queen rising from a moonlit ocean, pearl tiara, trident,
    bioluminescent jellyfish, swirling waves
  traits: {Role: Sea Queen, Background: Moonlit Abyss, Companion: Jellyfish Swarm}

- name: Neon Ronin
  prompt: >-
    cyberpunk samurai in a rain-soaked neon megacity, glowing katana,
    holographic kanji signs, reflections in puddles, pink and cyan light
  traits: {Role: Ronin, Background: Neon Megacity, Item: Plasma Katana}

- name: Grove Whisperer
  prompt: >-
    gentle forest spirit surrounded by dozens of tiny colorful forest
    sprites, ancient glowing tree, fireflies, magical mist
  traits: {Role: Forest Spirit, Background: Spirit Grove, Companion: Sprite Choir}

- name: Starseed
  prompt: >-
    astronaut planting a glowing star into a tiny floating planet, nebula sky,
    constellation-patterned suit, stardust trails
  traits: {Role: Star Gardener, Background: Nebula, Item: Newborn Star}

- name: The Swamp Witch
  prompt: >-
    swamp witch stirring a bubbling cauldron, green mist, frogs wearing tiny
    hats, crooked hat with mushrooms, glowing potion bottles
  traits: {Role: Witch, Background: Witch Swamp, Companion: Frog Court}

- name: Winter Spirit
  prompt: >-
    ethereal winter spirit made of snow and ice, crystal antlers, aurora
    borealis sky, frozen lake, snow owl companion
  traits: {Role: Winter Spirit, Headwear: Crystal Antlers, Companion: Snow Owl}

- name: The Dragon Rider
  prompt: >-
    rugged adventurer riding an enormous friendly dragon over a patchwork
    valley at sunset, clouds below, wind-swept scarf
  traits: {Role: Dragon Rider, Background: Sky Valley, Companion: Great Dragon}

- name: Clockwork Inventor
  prompt: >-
    steampunk inventor with brass goggles in a workshop full of gears, steam
    and copper pipes, tiny clockwork birds, glowing amber light
  traits: {Role: Inventor, Background: Gearworks, Companion: Clockwork Birds}

- name: The Void Wanderer
  prompt: >-
    mysterious hooded wanderer walking through a void realm, floating runes,
    shattered moon, single piercing eye glow, eerie purple cosmic light
  traits: {Role: Void Wanderer, Background: Void Realm, Item: Rune Lantern}
