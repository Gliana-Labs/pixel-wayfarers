# Hand-authored 1/1s. Each gets its own name, bespoke prompt and trait values
# that exist nowhere else in the collection. Count must match tiers.legendary.count.
- name: The Mayor
  prompt: >-
    beloved city mayor waving from a city hall balcony at night, red sash,
    giant fireworks over the skyline, confetti, cheering crowd below
  traits: {Role: Mayor, Background: City Hall Balcony, Accessory: Mayor Sash}

- name: The Whale
  prompt: >-
    wealthy human crypto investor in a sharp suit in a penthouse office above
    the skyline, wall of glowing green charts, gold coins raining down, calm
    smug smile, a small gold whale pin on the lapel
  traits: {Role: Crypto Whale, Background: Whale Penthouse, Item: Coin Rain}

- name: Night Rider
  prompt: >-
    delivery motorcyclist speeding through a rain-soaked neon megacity at night,
    glowing helmet visor, light trails, reflections in puddles
  traits: {Role: Night Rider, Background: Neon Megacity, Headwear: Glowing Visor}

- name: The Headliner
  prompt: >-
    rockstar headlining a sold-out stadium, guitar raised high, pyrotechnic
    flames, laser beams, sea of phone lights in the crowd
  traits: {Role: Headliner, Background: Sold-Out Stadium, Item: Legendary Guitar}

- name: First on Mars
  prompt: >-
    astronaut planting a plain white flag at a glowing Mars colony dome, red dust storm,
    earth as a tiny star in the sky, rover beside them
  traits: {Role: Mars Pioneer, Background: Mars Colony, Companion: Rover}

- name: Chef Flambe
  prompt: >-
    celebrity chef in a busy restaurant kitchen, huge flambe fire bursting from
    the pan, sparks, steam, gleaming copper pots
  traits: {Role: Celebrity Chef, Background: Five-Star Kitchen, Item: Flambe Pan}

- name: The Architect
  prompt: >-
    architect standing on a skyscraper crane at sunrise, rolled blueprints,
    unfinished tower glowing gold, city stretching to the horizon
  traits: {Role: Architect, Background: Crane at Sunrise, Item: Blueprints}

- name: Fire Captain
  prompt: >-
    heroic fire captain in front of a blazing building at night, holding a
    rescued kitten, water arcs from hoses, glowing embers
  traits: {Role: Fire Captain, Background: Five-Alarm Night, Companion: Rescued Kitten}

- name: The Streamer King
  prompt: >-
    mega streamer on a throne-like gaming chair, giant wall of monitors,
    floating chat bubbles and hearts, RGB lights, golden play button plaque
  traits: {Role: Streamer King, Background: Mega Setup, Item: Golden Play Button}

- name: Jet Captain
  prompt: >-
    jumbo jet captain in the cockpit at golden sunrise above the clouds,
    tipping cap, glowing instrument panel, city lights far below
  traits: {Role: Jet Captain, Background: Cockpit at Dawn, Headwear: Captain Cap}
