collection:
  name: Pixel Wayfarers
  description: >-
    1,000 AI-generated pixel wayfarers from every corner of a cozy pixel
    world. Chefs, pirates, astronauts, wizards. The rarer the wayfarer, the
    wilder the art.
  seed: 20260926
  supply: 1000
  external_url: "https://pixelwayfarers.com"

# Prompt pieces shared by every token. Keep brand/game names OUT of prompts.
style:
  base: >-
    cozy 16-bit pixel art portrait, charming life-sim RPG style, modern-day city life, warm saturated
    palette, clean dark outlines, chunky visible pixels, head and shoulders
    portrait of exactly one character from the chest up, centered, facing the
    viewer

# Tiers are rolled first (exact counts), then traits are rolled per tier.
# model/params go straight to Workers AI. colors/grid control the pixelation.
tiers:
  common:
    count: 600
    flavor: simple clean composition, soft daylight
    model: "black-forest-labs/flux-2-pro-preview"
    params: {width: 1024, height: 1024}
    colors: 24
  uncommon:
    count: 250
    flavor: detailed, golden hour lighting
    model: "black-forest-labs/flux-2-pro-preview"
    params: {width: 1024, height: 1024}
    colors: 32
  rare:
    count: 100
    flavor: highly detailed, rim lighting, subtle magical sparkles in the air
    model: "black-forest-labs/flux-2-pro-preview"
    params: {width: 1024, height: 1024}
    colors: 40
  epic:
    count: 40
    flavor: >-
      epic and intricate, glowing magical aura, dramatic lighting, floating
      particles, ornate details
    model: "black-forest-labs/flux-2-pro-preview"
    params: {width: 1024, height: 1024}
    colors: 56
  legendary:
    count: 10          # must equal the number of entries in legendaries.yaml
    model: "black-forest-labs/flux-2-pro-preview"
    params: {width: 1024, height: 1024}
    colors: 64

# How strongly a token prefers traits of its own tier over lower tiers.
same_tier_boost: 16

# Uncommon and up must carry at least this many traits exclusive to their own
# tier, so an Epic always looks epic and ranks above Rares on OpenSea.
min_own_tier_traits: {uncommon: 2, rare: 3, epic: 4}

# Every pair of tokens must differ in at least this many traits, so no two
# wayfarers look like near-copies (1 would only guarantee exact uniqueness).
min_trait_difference: 4

# Each option: value, prompt fragment, weight (default 1), tier (default common).
