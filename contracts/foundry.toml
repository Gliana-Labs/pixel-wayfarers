[profile.default]
src = "src"
test = "test"
libs = ["lib"]
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
# Robinhood Chain via our relay (robinhood.com is blocked by some ISPs);
# direct URLs: https://rpc.mainnet.chain.robinhood.com / https://rpc.testnet.chain.robinhood.com
robinhood = "https://pixelwayfarers.com/api/rpc/mainnet"
robinhood_testnet = "https://pixelwayfarers.com/api/rpc/testnet"
