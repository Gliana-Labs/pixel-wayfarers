[profile.default]
src = "src"
test = "test"
libs = ["lib"]
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
# Ethereum + Sepolia through our relay (upstream: publicnode)
mainnet = "https://pixelwayfarers.com/api/rpc/mainnet"
sepolia = "https://pixelwayfarers.com/api/rpc/testnet"
